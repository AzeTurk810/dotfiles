# -----------------------------------------------------
# HYPRLOCK CONFIG - EMERALD EDITION
# -----------------------------------------------------

$wall = ~/.config/hypr/hyprlock.png
$profile_pic = $HOME/.config/hypr/vivek.png

# Colors (Emerald Palette)
$emerald_main = rgba(0, 184, 148, 1.0)
$emerald_light = rgba(80, 250, 123, 0.9)
$emerald_dim = rgba(0, 184, 148, 0.3)
$bg_glass = rgba(20, 30, 25, 0.5)
$text_color = rgba(230, 245, 240, 0.9)

# GENERAL
general {
    hide_cursor = false
    ignore_empty_input = true
    text_trim = true
}

# BACKGROUND
background {
    monitor =
    path = $wall
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# DAY
label {
    monitor =
    text = cmd[update:1000] date +"%A"
    color = $emerald_light
    font_size = 85
    font_family = Sans
    position = 0, 350
    halign = center
    valign = center
}

# DATE-MONTH
label {
    monitor =
    text = cmd[update:1000] date +"%d %B"
    color = $text_color
    font_size = 35
    font_family = Sans
    position = 0, 255
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = cmd[update:1000] date +"- %I:%M %p -"
    color = $text_color
    font_size = 20
    font_family = Sans
    position = 0, 200
    halign = center
    valign = center
}

# PROFILE PHOTO
image {
    monitor =
    path = $profile_pic
    border_size = 3
    border_color = $emerald_main
    size = 130
    rounding = -1
    rotate = 0
    reload_time = -1
    position = 0, 40
    halign = center
    valign = center
}

# USER-BOX
shape {
    monitor =
    size = 300, 50
    color = $bg_glass
    rounding = 12
    border_size = 1
    border_color = $emerald_dim
    position = 0, -130
    halign = center
    valign = center
}

# USER GREETING
label {
    monitor =
    text =     $USER
    color = $emerald_light
    font_size = 16
    font_family = Sans
    position = 0, -130
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = $emerald_main
    inner_color = $bg_glass
    font_color = $text_color
    fade_on_empty = false
    font_family = Sans
    placeholder_text = <i><span foreground="##50fa7b99">🔒 Enter Password...</span></i>
    # placeholder_text = <i><span foreground="#50fa7b99">🔒 Enter Password...</span></i>
    hide_input = false
    position = 0, -195
    halign = center
    valign = center
    rounding = 12
}

# -----------------------------------------------------
# MEDIA PLAYER WIDGET (NO ALBUM ART)
# -----------------------------------------------------

# MUSIC CARD BACKGROUND
shape {
    monitor =
    size = 340, 90
    color = $bg_glass
    rounding = 16
    border_size = 1
    border_color = $emerald_dim
    position = 0, -280
    halign = center
    valign = center
    zindex = 1
}

# SONG TITLE (Centered)
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/Scripts/title.sh)"  
    color = $emerald_light
    font_size = 12
    font_family = Sans
    position = 0, -265
    halign = center
    valign = center
    zindex = 5
}

# ARTIST NAME (Centered)
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/Scripts/artist.sh)"
    color = $text_color
    font_size = 10
    font_family = Sans
    position = 0, -283
    halign = center
    valign = center
    zindex = 5
}

# MEDIA PREVIOUS BUTTON
label {
    monitor =
    text = 󰒮
    onclick = playerctl previous
    color = $emerald_light
    font_size = 14
    position = -35, -305
    halign = center
    valign = center
    zindex = 5
}

# MEDIA PLAY/PAUSE BUTTON
label {
    monitor =
    text = cmd[update:1000] playerctl status 2>/dev/null | grep -q "Playing" && echo "󰏤" || echo "󰐊"
    onclick = playerctl play-pause
    color = $emerald_light
    font_size = 14
    position = 0, -305
    halign = center
    valign = center
    zindex = 5
}

# MEDIA NEXT BUTTON
label {
    monitor =
    text = 󰒞
    onclick = playerctl next
    color = $emerald_light
    font_size = 14
    position = 35, -305
    halign = center
    valign = center
    zindex = 5
}

# -----------------------------------------------------
# SYSTEM STATUS BAR (BATTERY, VOLUME, NOTIFICATIONS)
# -----------------------------------------------------

# BATTERY 1 STATUS
label {
    monitor =
    text = cmd[update:5000] cat /sys/class/power_supply/BAT1/capacity 2>/dev/null | awk '{print "󰁹 " $1 "%"}' || echo "󰁹 N/A"
    color = $emerald_light
    font_size = 13
    font_family = Sans
    position = -100, -350
    halign = center
    valign = center
}

# NOTIFICATIONS COUNT (swaync)
label {
    monitor =
    text = cmd[update:1000] swaync-client -c 2>/dev/null | awk '{print "󰂚 " $1}' || echo "󰂚 0"
    color = $text_color
    font_size = 13
    font_family = Sans
    position = 0, -350
    halign = center
    valign = center
}

# SOUND / VOLUME LEVEL
label {
    monitor =
    text = cmd[update:1000] wpctl get-volume @DEFAULT_AUDIO_SINK@ 2>/dev/null | grep -q "MUTED" && echo "󰝟 Muted" || wpctl get-volume @DEFAULT_AUDIO_SINK@ 2>/dev/null | awk '{print "󰕾 " int($2*100) "%"}'
    onclick = wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
    color = $emerald_light
    font_size = 13
    font_family = Sans
    position = 100, -350
    halign = center
    valign = center
}

# -----------------------------------------------------
# POWER CONTROLS
# -----------------------------------------------------

# REBOOT
label {
    monitor =
    text = 󰜉
    color = $emerald_light
    font_size = 40
    onclick = reboot now
    position = 0, 80
    halign = center
    valign = bottom
}

# POWER OFF
label {
    monitor =
    text = 󰐥
    color = $emerald_light
    font_size = 40
    onclick = shutdown now
    position = 160, 80
    halign = center
    valign = bottom
}

# SUSPEND
label {
    monitor =
    text = 󰤄
    color = $emerald_light
    font_size = 40
    onclick = systemctl suspend
    position = -160, 80
    halign = center
    valign = bottom
}

