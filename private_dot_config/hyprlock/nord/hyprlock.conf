# -----------------------------------------------------
# HYPRLOCK CONFIG - NORD EDITION (OFFSET LAYOUT)
# -----------------------------------------------------

$wall = ~/.config/hypr/hyprlock.png
$profile_pic = $HOME/.config/hypr/vivek.png

# Colors (Nord Palette)
$nord_frost_teal = rgba(136, 192, 208, 1.0)     # #88c0d0
$nord_frost_blue = rgba(129, 161, 193, 0.9)     # #81a1c1
$nord_frost_dark = rgba(136, 192, 208, 0.25)    # #88c0d0 (dim)
$nord_bg_glass   = rgba(46, 52, 64, 0.65)       # #2e3440 with transparency
$nord_snow_white = rgba(236, 239, 244, 0.95)    # #eceff4

# GENERAL
general {
    hide_cursor = false
    ignore_empty_input = true
    text_trim = true
}

# BACKGROUND
background {
    monitor =
    path = $wall
    blur_passes = 2
    contrast = 0.9
    brightness = 0.8
    vibrancy = 0.2
    vibrancy_darkness = 0.0
}

# -----------------------------------------------------
# 1. TIME & DATE (Top Left)
# -----------------------------------------------------

# TIME
label {
    monitor =
    text = cmd[update:1000] date +"%I:%M %p"
    color = $nord_snow_white
    font_size = 50
    font_family = Sans
    position = 50, -40
    halign = left
    valign = top
}

# DATE & DAY
label {
    monitor =
    text = cmd[update:1000] date +"%A, %B %d"
    color = $nord_frost_teal
    font_size = 18
    font_family = Sans
    position = 53, -115
    halign = left
    valign = top
}

# -----------------------------------------------------
# 2. MEDIA PLAYER (Top Right)
# -----------------------------------------------------

# MEDIA CARD BACKGROUND
shape {
    monitor =
    size = 280, 75
    color = $nord_bg_glass
    rounding = 14
    border_size = 1
    border_color = $nord_frost_dark
    position = -40, -40
    halign = right
    valign = top
    zindex = 1
}

# SONG TITLE
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/Scripts/title.sh)"  
    color = $nord_frost_teal
    font_size = 11
    font_family = Sans
    position = -55, -52
    halign = right
    valign = top
    zindex = 5
}

# ARTIST NAME
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/Scripts/artist.sh)"
    color = $nord_snow_white
    font_size = 9
    font_family = Sans
    position = -55, -70
    halign = right
    valign = top
    zindex = 5
}

# MEDIA PREVIOUS BUTTON
label {
    monitor =
    text = 󰒮
    onclick = playerctl previous
    color = $nord_frost_blue
    font_size = 12
    position = -110, -90
    halign = right
    valign = top
    zindex = 5
}

# MEDIA PLAY/PAUSE BUTTON
label {
    monitor =
    text = cmd[update:1000] playerctl status 2>/dev/null | grep -q "Playing" && echo "󰏤" || echo "󰐊"
    onclick = playerctl play-pause
    color = $nord_frost_teal
    font_size = 12
    position = -80, -90
    halign = right
    valign = top
    zindex = 5
}

# MEDIA NEXT BUTTON
label {
    monitor =
    text = 󰒞
    onclick = playerctl next
    color = $nord_frost_blue
    font_size = 12
    position = -50, -90
    halign = right
    valign = top
    zindex = 5
}

# -----------------------------------------------------
# 3. AUTHENTICATION & PROFILE (Center Focus)
# -----------------------------------------------------

# PROFILE PHOTO
image {
    monitor =
    path = $profile_pic
    border_size = 3
    border_color = $nord_frost_teal
    size = 120
    rounding = -1
    rotate = 0
    reload_time = -1
    position = 0, 70
    halign = center
    valign = center
}

# USER GREETING
label {
    monitor =
    text =    $USER
    color = $nord_frost_blue
    font_size = 15
    font_family = Sans
    position = 0, -10
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 280, 46
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = $nord_frost_teal
    inner_color = $nord_bg_glass
    font_color = $nord_snow_white
    fade_on_empty = false
    font_family = Sans
    placeholder_text = <i><span foreground="##88c0d099">🔒 Enter Password...</span></i>
    hide_input = false
    position = 0, -60
    halign = center
    valign = center
    rounding = 10
}

# -----------------------------------------------------
# 4. SYSTEM STATUS (Under Password Box)
# -----------------------------------------------------

# BATTERY STATUS
label {
    monitor =
    text = cmd[update:5000] cat /sys/class/power_supply/BAT1/capacity 2>/dev/null | awk '{print "󰁹 " $1 "%"}' || echo "󰁹 N/A"
    color = $nord_snow_white
    font_size = 11
    font_family = Sans
    position = -80, -115
    halign = center
    valign = center
}

# NOTIFICATIONS COUNT (swaync)
label {
    monitor =
    text = cmd[update:1000] swaync-client -c 2>/dev/null | awk '{print "󰂚 " $1}' || echo "󰂚 0"
    color = $nord_snow_white
    font_size = 11
    font_family = Sans
    position = 0, -115
    halign = center
    valign = center
}

# VOLUME LEVEL
label {
    monitor =
    text = cmd[update:1000] wpctl get-volume @DEFAULT_AUDIO_SINK@ 2>/dev/null | grep -q "MUTED" && echo "󰝟 Muted" || wpctl get-volume @DEFAULT_AUDIO_SINK@ 2>/dev/null | awk '{print "󰕾 " int($2*100) "%"}'
    onclick = wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
    color = $nord_snow_white
    font_size = 11
    font_family = Sans
    position = 80, -115
    halign = center
    valign = center
}

# -----------------------------------------------------
# 5. POWER CONTROLS (Bottom Right)
# -----------------------------------------------------

# SUSPEND
label {
    monitor =
    text = 󰤄
    color = $nord_frost_blue
    font_size = 24
    onclick = systemctl suspend
    position = -110, 35
    halign = right
    valign = bottom
}

# REBOOT
label {
    monitor =
    text = 󰜉
    color = $nord_frost_blue
    font_size = 24
    onclick = reboot now
    position = -70, 35
    halign = right
    valign = bottom
}

# POWER OFF
label {
    monitor =
    text = 󰐥
    color = $nord_frost_teal
    font_size = 24
    onclick = shutdown now
    position = -30, 35
    halign = right
    valign = bottom
}

